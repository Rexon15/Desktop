<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width">

<title>My Superhero card</title>
<style>
  body {
    background-color: coral;
    color: white;
    font-family: Arial, sans-serif;
  }

.hero name {
    font-size: 24px;
    font-weight: bold;
  }

  .hero img {
    width: 200px;
    height: auto;
    border-radius: 10px;
  }

  .hero-description {
    font-weight: 60px;
    font-size: 18px;
  }

  .hero {
    background-color: white;
    color: black;
    text-shadow: 3px 3px orange;
  }

.tagline {
    
font-weight:bold;
    color: yellow;
  }

  .footer {
    text-transform: uppercase;
    color:green;
    text-decoration: underline;
    
  }


  .power {
    font-weight: bold;
    color: blue;
  }    
  
  
  .weakness {
    font-weight: bold;
    color: rgb(80, 73, 73);
    text-decoration: line-through;

    .badge {
    font-weight: bold;
    font-size: 20px;
    color: gold;
    transform:rotate(15deg);
  }

  .made-by {
    color: coral;
    font-style: italic;
  }
</style>
</head>
<body>
    <div class="hero">
        <h1 class="hero-name">Super Rex</h1>
        <img src="C:\Users\futur\Downloads\image_7813a48b.jpg" alt="Super Rex">
        <p class="hero-description">Super Rex is a fearless superhero with incredible speed and the ability to see into the future.</p>
        <p class="tagline">"Saving the world, one hero at a time!"</p>
        <p class="power">Power: Super Speed and Future Vision</p>
        <p class="weakness">Weakness: Particular foods (e.g., fish Especially sardines and tuna.)</p>
        <span class="badge">Hero of the Year</span>
    </div>
    <footer class="footer">
        <p class="made-by">Created by REX</p>
    </footer>
    
</body>
</html>
