<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width">

<title>Explore the Web</title>

<style>


  /* Universal selector-applies to everything on the page */
  * {
    font-family: Arial, sans-serif;
    font-size: 16px;
  }

  /* Element selectors */
   
  body {
    background-color: #c41212;
    margin: 0;
    padding: 0;
  }

    h1 {
        color: #fff;
        text-align: center;
        margin-top: 50px;
    }


    h2 {
        color: #02f246;
        text-align: center;
        margin-top: 20px;
    }

    p {
        color: #8b0ed3;
        text-align: center;
        margin-top: 20px;
    }

    /* Class selector */
    .my-details {
        color: #0ab4a3;
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
    }


   </style>

   </head>
   <body>

    <h1>My colour card </h1>
     
    <!-- Inline CSS Add style="color: #fff; text-align: center; margin-top: 20px;" to the p tag -->
    <p style="color: #fff; text-align: center; margin-top: 20px;">This is my first CSS page</p> 

    <h2>My Details</h2>
    <p class="my-details">Name: Rex </p>  
    <div id="my-details">
        <p class="my-details">Name: Rex</p>
        <p class="my-details">Age: 11</p>
        <p class="my-details">School: STM high school</p>  
        <p class="my-details">Grade: 7🏫</p>
    </div>




   </body>
