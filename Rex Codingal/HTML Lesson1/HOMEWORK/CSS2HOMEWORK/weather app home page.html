<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #4b7bec);
      color: #17324d;
    }

    .weather-app {
      width: 90%;
      max-width: 760px;
      margin: 40px auto;
      padding: 28px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      color: #1d5d9b;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    input,
    button {
      padding: 12px;
      border: 1px solid #b7cde3;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      width: 150px;
    }

    button {
      border: none;
      background-color: #1d8cf8;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #1473d0;
    }

    .current-weather {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      background-color: #e7f5ff;
      border-radius: 16px;
    }

    .location {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .date {
      margin: 0;
      color: #55748f;
    }

    .temperature {
      margin: 0;
      font-size: 58px;
      color: #f28c28;
    }

    .condition {
      margin: 5px 0 0;
      text-align: center;
      color: #55748f;
    }

    .weather-icon {
      font-size: 62px;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin: 24px 0;
      padding: 18px;
      background-color: #f7fbff;
      border-radius: 12px;
      text-align: center;
    }

    .details p {
      margin: 5px 0;
    }

    .label {
      color: #55748f;
      font-size: 14px;
    }

    h2 {
      margin-bottom: 14px;
      color: #1d5d9b;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .forecast-day {
      padding: 16px 8px;
      background-color: #e7f5ff;
      border-radius: 12px;
      text-align: center;
    }

    .forecast-day p {
      margin: 8px 0;
    }

    .forecast-icon {
      font-size: 30px;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: #55748f;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header,
      .current-weather {
        flex-direction: column;
        text-align: center;
      }

      .search-box {
        width: 100%;
        justify-content: center;
      }

      .forecast {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="weather-app">
    <header>
      <h1>Weather App</h1>
      <form class="search-box">
        <input type="text" placeholder="Enter city">
        <button type="submit">Search</button>
      </form>
    </header>

    <section class="current-weather">
      <div>
        <h2 class="location">New Delhi, India</h2>
        <p class="date">Monday, 2 November 2026</p>
      </div>
      <div>
        <div class="weather-icon">☀️</div>
        <p class="condition">Sunny</p>
      </div>
      <p class="temperature">28°C</p>
    </section>

    <section class="details">
      <div>
        <p class="label">Feels like</p>
        <p>30°C</p>
      </div>
      <div>
        <p class="label">Humidity</p>
        <p>45%</p>
      </div>
      <div>
        <p class="label">Wind</p>
        <p>12 km/h</p>
      </div>
    </section>

    <section>
      <h2>4-Day Forecast</h2>
      <div class="forecast">
        <article class="forecast-day">
          <strong>Tue</strong>
          <p class="forecast-icon">🌤️</p>
          <p>29°C</p>
        </article>
        <article class="forecast-day">
          <strong>Wed</strong>
          <p class="forecast-icon">☁️</p>
          <p>26°C</p>
        </article>
        <article class="forecast-day">
          <strong>Thu</strong>
          <p class="forecast-icon">🌧️</p>
          <p>24°C</p>
        </article>
        <article class="forecast-day">
          <strong>Fri</strong>
          <p class="forecast-icon">☀️</p>
          <p>28°C</p>
        </article>
      </div>
    </section>

    <footer>
      <p>Have a great day!</p>
    </footer>
  </main>
</body>
</html>
