    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <style>
        * {
        box-sizing: border-box;
        }

        body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eaf0f7;
        color: #172033;
        font-family: Arial, Helvetica, sans-serif;
        }

        .calculator {
        width: min(100%, 360px);
        padding: 24px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(31, 48, 75, 0.16);
        }

        h1 {
        margin: 0 0 18px;
        font-size: 1.4rem;
        text-align: center;
        }

        .display {
        width: 100%;
        height: 76px;
        margin-bottom: 16px;
        padding: 12px 16px;
        overflow: hidden;
        border: 0;
        border-radius: 12px;
        background: #f1f5fa;
        color: #172033;
        font: inherit;
        font-size: 2rem;
        text-align: right;
        }

        .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        }

        button {
        min-height: 58px;
        border: 0;
        border-radius: 12px;
        background: #e9eef5;
        color: #172033;
        cursor: pointer;
        font: inherit;
        font-size: 1.25rem;
        font-weight: 600;
        transition: background-color 120ms ease, transform 120ms ease;
        }

        button:hover {
        background: #dce5f0;
        }

        button:active {
        transform: scale(0.96);
        }

        button:focus-visible {
        outline: 3px solid #78a8ff;
        outline-offset: 2px;
        }

        .utility {
        background: #dce7f5;
        }

        .operator {
        background: #d9e7ff;
        color: #1453ad;
        }

        .equals {
        grid-column: span 2;
        background: #2563eb;
        color: #ffffff;
        }

        .equals:hover {
        background: #1d4ed8;
        }

        .hint {
        margin: 16px 0 0;
        color: #657187;
        font-size: 0.85rem;
        text-align: center;
        }
    </style>
    </head>
    <body>
    <main class="calculator" aria-label="Calculator">
        <h1>My Calculator</h1>
        <input class="display" id="display" type="text" value="0" aria-label="Calculator display" readonly>

        <div class="buttons">
        <button class="utility" type="button" data-action="clear" aria-label="Clear">C</button>
        <button class="utility" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="operator" type="button" data-operator="/" aria-label="Divide">÷</button>
        <button class="operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button class="operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button class="operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-action="decimal">.</button>

        <button type="button" data-digit="0">0</button>
        <button class="equals" type="button" data-action="equals">=</button>
        </div>

        <p class="hint">You can also use your keyboard.</p>
    </main>

    <script>
        const display = document.getElementById("display");
        const buttons = document.querySelector(".buttons");

        let currentInput = "0";
        let previousInput = null;
        let operator = null;
        let startNewNumber = false;

        function updateDisplay() {
        display.value = currentInput;
        }

        function enterDigit(digit) {
        if (currentInput === "Error") {
            clearCalculator();
        }

        if (startNewNumber) {
            currentInput = digit;
            startNewNumber = false;
        } else if (currentInput === "0") {
            currentInput = digit;
        } else {
            currentInput += digit;
        }
        updateDisplay();
        }

        function enterDecimal() {
        if (currentInput === "Error") {
            clearCalculator();
        }

        if (startNewNumber) {
            currentInput = "0.";
            startNewNumber = false;
        } else if (!currentInput.includes(".")) {
            currentInput += ".";
        }
        updateDisplay();
        }

        function calculate(first, second, selectedOperator) {
        const left = Number(first);
        const right = Number(second);
        let result;

        if (selectedOperator === "+") result = left + right;
        if (selectedOperator === "-") result = left - right;
        if (selectedOperator === "*") result = left * right;
        if (selectedOperator === "/") {
            if (right === 0) return "Error";
            result = left / right;
        }

        if (!Number.isFinite(result)) return "Error";
        return String(Number(result.toPrecision(12)));
        }

        function chooseOperator(nextOperator) {
        if (currentInput === "Error") return;

        if (operator && !startNewNumber) {
            currentInput = calculate(previousInput, currentInput, operator);
            updateDisplay();
            if (currentInput === "Error") {
            previousInput = null;
            operator = null;
            startNewNumber = true;
            return;
            }
        }

        previousInput = currentInput;
        operator = nextOperator;
        startNewNumber = true;
        }

        function showResult() {
        if (!operator || previousInput === null || currentInput === "Error") return;

        currentInput = calculate(previousInput, currentInput, operator);
        previousInput = null;
        operator = null;
        startNewNumber = true;
        updateDisplay();
        }

        function clearCalculator() {
        currentInput = "0";
        previousInput = null;
        operator = null;
        startNewNumber = false;
        updateDisplay();
        }

        function deleteDigit() {
        if (currentInput === "Error") {
            clearCalculator();
            return;
        }

        if (startNewNumber) {
            currentInput = "0";
            startNewNumber = false;
        } else {
            currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
            if (currentInput === "-") currentInput = "0";
        }
        updateDisplay();
        }

        buttons.addEventListener("click", function (event) {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
        if (button.dataset.operator) chooseOperator(button.dataset.operator);
        if (button.dataset.action === "decimal") enterDecimal();
        if (button.dataset.action === "equals") showResult();
        if (button.dataset.action === "clear") clearCalculator();
        if (button.dataset.action === "delete") deleteDigit();
        });

        document.addEventListener("keydown", function (event) {
        if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
        else if (event.key === ".") enterDecimal();
        else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
        else if (event.key === "Enter" || event.key === "=") showResult();
        else if (event.key === "Backspace") deleteDigit();
        else if (event.key === "Escape") clearCalculator();
        else return;

        event.preventDefault();
        });
    </script>
    </body>
    </html>
